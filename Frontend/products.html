<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Shop all — loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Catalog data must load before the listing behaviour. -->
  <script defer src="assets/js/products-data.js"></script>

  <script defer src="assets/js/motion.js"></script>
</head>
<body class="shop-page">
  <header class="shop-nav">
    <a class="brand" href="index.html">loop<span>°</span></a>
    <nav aria-label="Main navigation"><a href="products.html">Shop</a><a class="nav-category" href="index.html#collections">Categories</a><a href="index.html#our-story">Our story</a></nav>

  <footer><p class="brand">loop<span>°</span></p><div class="footer-bottom"><span>© 2026 LOOP STUDIO</span><span>HANDMADE WITH PATIENCE</span></div></footer>
